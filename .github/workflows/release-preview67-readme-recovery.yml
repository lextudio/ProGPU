name: Recover preview.67 package readmes

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-preview67-readme-recovery
  cancel-in-progress: false

jobs:
  publish:
    name: Verify qualified bytes and complete preview.67 publication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PROGPU_PACKAGE_VERSION: 0.1.0-preview.67
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Validate the bounded recipe and archive rejection controls
        run: |
          python3 eng/test-package-sizes.py
          python3 eng/test-preview67-readme-recovery.py
      - name: Require original qualification and the reviewed recipe Build
        run: python3 eng/progpu-verify-preview67-qualification.py "$GITHUB_SHA" qualified-source.json
      - name: Download the exact original qualified release artifact
        run: gh api repos/wieslawsoltes/ProGPU/actions/artifacts/11720419571/zip > original-packages.zip
      - name: Repair only original specialized README paths
        run: python3 eng/progpu-recover-preview67-readmes.py original-packages.zip recovered
      - name: Verify complete dependency closure and every archive
        run: |
          PROGPU_PACKAGE_OUTPUT="$GITHUB_WORKSPACE/recovered/packages/Release" PROGPU_PACKAGE_GROUP=all ./eng/progpu-verify-packages.sh
          python3 eng/progpu-verify-package-sizes.py recovered/packages/Release recovered/packages-avalonia/Release
      - name: Preserve original qualification and exact byte-comparison receipts
        uses: actions/upload-artifact@v7
        with:
          name: preview67-readme-recovery
          path: |
            qualified-source.json
            recovered/readme-recovery-receipt.json
            recovered/packages/Release/*.nupkg
            recovered/packages/Release/*.snupkg
            recovered/packages-avalonia/Release/*.nupkg
            recovered/packages-avalonia/Release/*.snupkg
          if-no-files-found: error
      - name: Complete immutable NuGet versions
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in recovered/packages/Release/*.nupkg recovered/packages-avalonia/Release/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
      - name: Create the matching GitHub prerelease without moving its tag
        run: |
          gh release create v0.1.0-preview.67 \
            recovered/packages/Release/*.nupkg recovered/packages/Release/*.snupkg \
            recovered/packages-avalonia/Release/*.nupkg recovered/packages-avalonia/Release/*.snupkg \
            qualified-source.json recovered/readme-recovery-receipt.json \
            --title 'ProGPU 0.1.0-preview.67' --prerelease --verify-tag \
            --notes-file docs/release-preview67-readme-recovery.md
